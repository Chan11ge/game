<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>植物防守</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Microsoft YaHei', sans-serif;
    user-select: none;
  }
  #gameContainer {
    position: relative;
    border: 3px solid #4a7c3f;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(74, 124, 63, 0.4);
  }
  canvas { display: block; border-radius: 9px; }
  #ui {
    display: none;
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    justify-content: space-between;
    pointer-events: none;
    gap: 6px;
  }
  .ui-box {
    background: rgba(0,0,0,0.6);
    color: #fff;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    backdrop-filter: blur(4px);
    white-space: nowrap;
  }
  #gameOver {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.7);
    border-radius: 9px;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #fff;
    z-index: 10;
  }
  #gameOver h1 { font-size: 48px; margin-bottom: 10px; }
  #gameOver p { font-size: 20px; margin-bottom: 20px; }
  #gameOver button {
    padding: 12px 40px;
    font-size: 18px;
    border: none;
    border-radius: 25px;
    background: #4caf50;
    color: #fff;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.15s;
  }
  #gameOver button:hover { transform: scale(1.08); }
</style>
</head>
<body>

<div id="gameContainer">
  <canvas id="game"></canvas>
  <div id="ui">
    <span class="ui-box">🌱 血量: <span id="hpDisplay">100</span></span>
    <span class="ui-box">🪙 金币: <span id="goldDisplay">0</span></span>
    <span class="ui-box">💀 击杀: <span id="scoreDisplay">0</span></span>
    <span class="ui-box">🌊 波次: <span id="waveDisplay">1</span></span>
  </div>
  <div id="gameOver">
    <h1 id="goTitle">游戏结束</h1>
    <p id="goScore">击杀数: 0</p>
    <button id="restartBtn">返回菜单</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 900, H = 500;
canvas.width = W; canvas.height = H;

// ── Audio System ──
let audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(freq, type, duration, vol = 0.12, glide = 0) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (glide) osc.frequency.linearRampToValueAtTime(freq + glide, t + duration);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + duration);
}

function sfxShoot() {
  playSound(800, 'square', 0.06, 0.06);
  playSound(1200, 'sine', 0.04, 0.03, -400);
}

function sfxHit() {
  playSound(200, 'triangle', 0.08, 0.08);
  playSound(600, 'sine', 0.05, 0.04, 300);
}

function sfxPlayerHurt() {
  playSound(80, 'sawtooth', 0.15, 0.15);
  playSound(150, 'square', 0.1, 0.08, -50);
}

function sfxZombieDie() {
  playSound(300, 'triangle', 0.12, 0.1, -200);
  playSound(500, 'sine', 0.07, 0.08, 400);
}

function sfxUpgrade() {
  playSound(400, 'sine', 0.1, 0.1, 800);
  playSound(600, 'sine', 0.08, 0.12, 600);
  setTimeout(() => playSound(1200, 'triangle', 0.08, 0.06), 100);
}

function sfxWaveClear() {
  playSound(523, 'sine', 0.15, 0.12);
  setTimeout(() => playSound(659, 'sine', 0.15, 0.12), 120);
  setTimeout(() => playSound(784, 'sine', 0.2, 0.2), 240);
}

function sfxEnemyShoot() {
  playSound(300, 'sawtooth', 0.1, 0.05, -100);
  playSound(150, 'triangle', 0.07, 0.04);
}

// Background music engine
let bgmOscs = [];
let bgmPlaying = false;
let bgmNoteIdx = 0;
let bgmInterval = null;
let bgmNotes = [];
let bgmTempo = 280;
let bgmVol = 0.025;
let bgmBassVol = 0.015;

const GAME_BGM_NOTES = [
  262,294,330,349,392,349,330,294,
  262,294,330,349,392,440,392,349,
  330,349,392,440,523,440,392,349,
  330,294,262,294,330,349,330,294,
];
const MENU_BGM_NOTES = [
  392,440,523,440,392,349,330,294,
  330,349,392,440,523,587,659,587,
  523,440,392,349,330,349,392,440,
  523,659,784,659,523,440,392,349,
  392,440,392,349,330,349,330,294,
  262,294,330,349,392,440,523,440,
];

function playBGMNote() {
  if (!bgmPlaying) return;
  const freq = bgmNotes[bgmNoteIdx % bgmNotes.length];
  // Melody
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(bgmVol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.28);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(audioCtx.currentTime);
  osc.stop(audioCtx.currentTime + 0.3);
  bgmOscs.push(osc);
  // Bass
  const bass = audioCtx.createOscillator();
  const bassGain = audioCtx.createGain();
  bass.type = 'triangle';
  bass.frequency.setValueAtTime(freq / 2, audioCtx.currentTime);
  bassGain.gain.setValueAtTime(bgmBassVol, audioCtx.currentTime);
  bassGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
  bass.connect(bassGain); bassGain.connect(audioCtx.destination);
  bass.start(audioCtx.currentTime);
  bass.stop(audioCtx.currentTime + 0.42);
  bgmOscs.push(bass);
  bgmNoteIdx++;
}

function startBGM(notes, tempo = 280, vol = 0.025, bassVol = 0.015) {
  if (!audioCtx) return;
  stopBGM();
  bgmNotes = notes;
  bgmTempo = tempo;
  bgmVol = vol;
  bgmBassVol = bassVol;
  bgmPlaying = true;
  bgmNoteIdx = 0;
  playBGMNote();
  bgmInterval = setInterval(playBGMNote, tempo);
}

function stopBGM() {
  bgmPlaying = false;
  if (bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
  for (const osc of bgmOscs) { try { osc.stop(); } catch(e) {} }
  bgmOscs = [];
}

function startGameBGM() { startBGM(GAME_BGM_NOTES, 280, 0.025, 0.015); }
function startMenuBGM() { startBGM(MENU_BGM_NOTES, 200, 0.03, 0.018); }

const uiDiv = document.getElementById('ui');
const goldDisplay = document.getElementById('goldDisplay');
const hpDisplay = document.getElementById('hpDisplay');
const scoreDisplay = document.getElementById('scoreDisplay');
const waveDisplay = document.getElementById('waveDisplay');
const gameOverDiv = document.getElementById('gameOver');
const goTitle = document.getElementById('goTitle');
const goScore = document.getElementById('goScore');
const restartBtn = document.getElementById('restartBtn');

// ── Difficulty Config ──
const DIFFICULTIES = {
  easy: {
    name: '简单', desc: '老奶奶来也能玩', color: '#4caf50',
    playerMaxHp: 150, zombieHpMult: 0.55, zombieSpdMult: 0.65,
    zombieDmgMult: 0.45, waveSpawnMult: 0.6, goldMult: 1.6,
    startGold: 40, waveRegen: 35, rangedChanceMult: 0.4,
    tankChanceMult: 0.3, enemyBulletDmgMult: 0.4, enemyFireRateMult: 0.6,
    totalWaves: 10,
  },
  normal: {
    name: '普通', desc: '普适人群', color: '#ffaa00',
    playerMaxHp: 100, zombieHpMult: 1.0, zombieSpdMult: 1.0,
    zombieDmgMult: 1.0, waveSpawnMult: 1.0, goldMult: 1.0,
    startGold: 0, waveRegen: 20, rangedChanceMult: 1.0,
    tankChanceMult: 1.0, enemyBulletDmgMult: 1.0, enemyFireRateMult: 1.0,
    totalWaves: 15,
  },
  hard: {
    name: '困难', desc: '基本不可能通关', color: '#ff4444',
    playerMaxHp: 55, zombieHpMult: 1.7, zombieSpdMult: 1.45,
    zombieDmgMult: 2.0, waveSpawnMult: 1.6, goldMult: 0.5,
    startGold: 0, waveRegen: 8, rangedChanceMult: 2.2,
    tankChanceMult: 3.0, enemyBulletDmgMult: 1.6, enemyFireRateMult: 1.5,
    totalWaves: 20,
  },
};
let difficulty = null;

// ── Game State ──
let gamePhase = 'menu'; // 'menu' | 'playing' | 'gameover'
let paused = false;
let easterEgg = false;
let inputBuffer = '';
let player, bullets, enemyBullets, zombies, particles, floatingTexts;
let score, gold, wave, waveTimer, zombiesToSpawn, spawnCooldown;
let mouseX = W/2, mouseY = H/2;
let shakeAmount = 0;
let menuParticles = [];
let menuTime = 0;
const GROUND_Y = H - 40;

// ── Upgrade System ──
const UPGRADE_DEFS = [
  { name: '攻击力',   icon: '⚔️', baseCost: 25, costScale: 20, desc: '每级+3伤害',     effect: 'dmg' },
  { name: '射速',     icon: '⏱️', baseCost: 35, costScale: 25, desc: '每级+15%射速',    effect: 'spd' },
  { name: '多重射击', icon: '🔱', baseCost: 70, costScale: 45, desc: '每级+1发子弹',    effect: 'multi' },
  { name: '穿透',     icon: '💠', baseCost: 100, costScale: 60, desc: '每级+1穿透',     effect: 'pierce' },
  { name: '生命回复', icon: '💚', baseCost: 60, costScale: 40, desc: '每波+10HP回复',   effect: 'regen' },
  { name: '生命提升', icon: '❤️', baseCost: 80, costScale: 50, desc: '每级+25最大生命',  effect: 'maxhp' },
];
let upgradeLevels;

function upgradeCost(idx) {
  return UPGRADE_DEFS[idx].baseCost + upgradeLevels[idx] * UPGRADE_DEFS[idx].costScale;
}
function getDmg()       { const v = 5 + upgradeLevels[0] * 3; return easterEgg ? v * 10 : v; }
function getFireRate()  { const v = Math.max(4, Math.floor(12 / (1 + upgradeLevels[1] * 0.15))); return easterEgg ? Math.max(1, Math.floor(v / 3)) : v; }
function getBulletCount(){ const v = 1 + upgradeLevels[2]; return easterEgg ? v * 3 : v; }
function getPierce()    { const v = upgradeLevels[3]; return easterEgg ? v + 5 : v; }
function getRegen()     { const v = 10 + upgradeLevels[4] * 10; return easterEgg ? v * 10 : v; }
function getMaxHpBonus(){ const v = upgradeLevels[5] * 25; return easterEgg ? v * 10 : v; }

// ── Init game state ──
function initGameState() {
  const d = DIFFICULTIES[difficulty];
  const mult = easterEgg ? 10 : 1;
  player = { x: W/2, y: H/2, radius: 22, hp: d.playerMaxHp * mult, maxHp: d.playerMaxHp * mult };
  bullets = [];
  enemyBullets = [];
  zombies = [];
  particles = [];
  floatingTexts = [];
  score = 0;
  gold = d.startGold * mult;
  wave = 1;
  waveTimer = 0;
  zombiesToSpawn = 0;
  spawnCooldown = 0;
  shakeAmount = 0;
  upgradeLevels = [0, 0, 0, 0, 0, 0];
}

// ── Input ──
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;
  if (gamePhase === 'playing') {
    player.x += (mouseX - player.x) * 0.18;
    player.y += (mouseY - player.y) * 0.18;
    player.x = Math.max(player.radius, Math.min(W - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(H - player.radius, player.y));
  }
});

canvas.addEventListener('click', e => {
  initAudio();
  if (!bgmPlaying) startMenuBGM();
  if (gamePhase !== 'menu') return;
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;
  // Three buttons centered
  const btnW = 200, btnH = 80, gap = 30;
  const startX = W/2 - btnW/2;
  const totalH = 3 * btnH + 2 * gap;
  const startY = H/2 - totalH/2 + 20;
  const keys = ['easy', 'normal', 'hard'];
  for (let i = 0; i < 3; i++) {
    const bx = startX, by = startY + i * (btnH + gap);
    if (cx >= bx && cx <= bx + btnW && cy >= by && cy <= by + btnH) {
      startGame(keys[i]);
      return;
    }
  }
});

window.addEventListener('keydown', e => {
  // Menu phase: easter egg input
  if (gamePhase === 'menu') {
    initAudio();
    if (!bgmPlaying) startMenuBGM();
    if (e.key.length === 1 && e.key >= 'a' && e.key <= 'z') {
      inputBuffer += e.key.toLowerCase();
      if (inputBuffer.length > 30) inputBuffer = inputBuffer.slice(-30);
      if (inputBuffer.endsWith('zuozhehaoshuai')) {
        easterEgg = !easterEgg;
        inputBuffer = '';
        for (let i = 0; i < 50; i++) {
          menuParticles.push({
            x: W/2, y: H/2,
            color: ['#FFD700','#ff4444','#4caf50','#cc44ff','#ffaa00'][Math.floor(Math.random()*5)],
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            life: 1, decay: 0.008 + Math.random() * 0.015,
            size: 3 + Math.random() * 5,
          });
        }
      }
    }
    return;
  }
  if (gamePhase !== 'playing') return;
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
    e.preventDefault();
    paused = !paused;
    canvas.style.cursor = paused ? 'default' : 'none';
    return;
  }
  if (paused) return;
  const idx = parseInt(e.key) - 1;
  if (idx >= 0 && idx <= 5) {
    const cost = upgradeCost(idx);
    if (gold >= cost) {
      gold -= cost;
      upgradeLevels[idx]++;
      goldDisplay.textContent = gold;
      spawnParticles(player.x, player.y - 20, '#FFD700', 12);
      floatingTexts.push({
        x: player.x, y: player.y - 30,
        text: UPGRADE_DEFS[idx].name + ' Lv.' + upgradeLevels[idx] + '!',
        life: 1, color: '#FFD700',
      });
      sfxUpgrade();
      // HP upgrade: increase max HP and heal
      if (idx === 5) {
        const d = DIFFICULTIES[difficulty];
        player.maxHp = d.playerMaxHp + getMaxHpBonus();
        player.hp = Math.min(player.maxHp, player.hp + 25);
        hpDisplay.textContent = player.hp;
      }
    } else {
      floatingTexts.push({
        x: player.x, y: player.y - 30,
        text: '金币不足! 需要 ' + cost,
        life: 1, color: '#ff6666',
      });
    }
  }
});

restartBtn.addEventListener('click', () => {
  gameOverDiv.style.display = 'none';
  uiDiv.style.display = 'none';
  goBackToMenu();
});

// ── Helpers ──
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

function spawnParticles(x, y, color, count) {
  const arr = gamePhase === 'menu' ? menuParticles : particles;
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 4;
    arr.push({
      x, y, color,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.02 + Math.random() * 0.04,
      size: 2 + Math.random() * 3,
    });
  }
}

function spawnZombie() {
  const d = DIFFICULTIES[difficulty];
  const side = Math.floor(Math.random() * 3);
  let x, y;
  if (side === 0) { x = -30; y = Math.random() * H * 0.7 + 30; }
  else if (side === 1) { x = W + 30; y = Math.random() * H * 0.7 + 30; }
  else { x = Math.random() * W; y = -30; }

  const rangedChance = (0.15 + wave * 0.03) * d.rangedChanceMult;
  const tankChance = (0.10 + wave * 0.02) * d.tankChanceMult;
  const roll = Math.random();

  let type, hp, speed, radius;
  if (roll < tankChance) {
    type = 'tank';
    hp = Math.floor((40 + wave * 28) * d.zombieHpMult);
    speed = (0.3 + wave * 0.06 + Math.random() * 0.2) * d.zombieSpdMult;
    radius = 25;
  } else if (roll < tankChance + rangedChance) {
    type = 'ranged';
    hp = Math.floor((10 + wave * 10) * d.zombieHpMult);
    speed = (0.4 + wave * 0.08 + Math.random() * 0.3) * d.zombieSpdMult;
    radius = 16;
  } else {
    type = 'normal';
    hp = Math.floor((15 + wave * 16) * d.zombieHpMult);
    speed = (0.6 + wave * 0.15 + Math.random() * 0.4) * d.zombieSpdMult;
    radius = 18;
  }

  zombies.push({
    x, y, radius, hp, maxHp: hp, speed, type,
    attackCooldown: 0,
    stunTimer: 0,
  });
}

function startWave() {
  const d = DIFFICULTIES[difficulty];
  zombiesToSpawn = Math.floor((3 + wave * 2) * d.waveSpawnMult);
  spawnCooldown = 0;
}

// ── Update ──
function update() {
  if (gamePhase !== 'playing' || paused) return;
  const d = DIFFICULTIES[difficulty];

  // Wave management
  if (zombiesToSpawn > 0) {
    spawnCooldown--;
    if (spawnCooldown <= 0) {
      spawnZombie();
      zombiesToSpawn--;
      spawnCooldown = Math.max(15, 50 - wave * 3);
    }
  }
  waveTimer++;
  if (zombiesToSpawn <= 0 && zombies.length === 0) {
    if (wave >= d.totalWaves) {
      endGame(true); return;
    }
    wave++;
    waveDisplay.textContent = wave + '/' + d.totalWaves;
    const regen = getRegen() + d.waveRegen;
    player.hp = Math.min(player.maxHp, player.hp + regen);
    hpDisplay.textContent = player.hp;
    floatingTexts.push({
      x: player.x, y: player.y - 40,
      text: '回复 +' + regen + ' HP',
      life: 1, color: '#88ff88',
    });
    sfxWaveClear();
    waveTimer = 0;
    startWave();
  }

  // Auto-shoot
  const fireRate = getFireRate();
  if (waveTimer % fireRate === 0 && zombies.length > 0) {
    let closest = null, closestDist = Infinity;
    for (const z of zombies) {
      const d2 = dist(player, z);
      if (d2 < closestDist) { closestDist = d2; closest = z; }
    }
    if (closest) {
      const baseAngle = Math.atan2(closest.y - player.y, closest.x - player.x);
      const count = getBulletCount();
      const spread = 0.12;
      for (let i = 0; i < count; i++) {
        const offset = count === 1 ? 0 : (i - (count - 1) / 2) * spread;
        const angle = baseAngle + offset;
        bullets.push({
          x: player.x, y: player.y,
          vx: Math.cos(angle) * 7,
          vy: Math.sin(angle) * 7,
          radius: count > 1 ? 3 : 4,
          damage: getDmg(),
          pierce: getPierce(),
        });
        sfxShoot();
      }
    }
  }

  // Update bullets
  for (const b of bullets) { b.x += b.vx; b.y += b.vy; }
  bullets = bullets.filter(b => b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20);

  // Update enemy bullets
  for (const eb of enemyBullets) { eb.x += eb.vx; eb.y += eb.vy; }
  enemyBullets = enemyBullets.filter(eb => eb.x > -20 && eb.x < W + 20 && eb.y > -20 && eb.y < H + 20);

  // Enemy bullet-player collision
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const eb = enemyBullets[i];
    if (dist(eb, player) < eb.radius + player.radius) {
      player.hp -= eb.damage;
      shakeAmount = 4;
      spawnParticles(player.x, player.y, '#cc44ff', 6);
      sfxPlayerHurt();
      enemyBullets.splice(i, 1);
      if (player.hp <= 0) { endGame(false); return; }
      hpDisplay.textContent = player.hp;
    }
  }

  // Update zombies
  for (const z of zombies) {
    if (z.stunTimer > 0) { z.stunTimer--; continue; }
    const d2 = dist(z, player);

    if (z.type === 'ranged') {
      const idealRange = 180 + Math.random() * 60;
      if (d2 > idealRange) {
        const angle = Math.atan2(player.y - z.y, player.x - z.x);
        z.x += Math.cos(angle) * z.speed;
        z.y += Math.sin(angle) * z.speed;
      } else if (d2 < idealRange - 40) {
        const angle = Math.atan2(z.y - player.y, z.x - player.x);
        z.x += Math.cos(angle) * z.speed * 0.8;
        z.y += Math.sin(angle) * z.speed * 0.8;
      }
      if (z.attackCooldown <= 0 && d2 < 450) {
        const angle = Math.atan2(player.y - z.y, player.x - z.x);
        const spread2 = (Math.random() - 0.5) * 0.3;
        enemyBullets.push({
          x: z.x, y: z.y,
          vx: Math.cos(angle + spread2) * 4,
          vy: Math.sin(angle + spread2) * 4,
          radius: 4,
          damage: Math.floor((3 + wave * 2) * d.enemyBulletDmgMult),
        });
        sfxEnemyShoot();
        z.attackCooldown = Math.floor((65 + Math.random() * 40) / d.enemyFireRateMult);
      }
    } else {
      const angle = Math.atan2(player.y - z.y, player.x - z.x);
      z.x += Math.cos(angle) * z.speed;
      z.y += Math.sin(angle) * z.speed;
      if (d2 < player.radius + z.radius && z.attackCooldown <= 0) {
        const baseDmg = z.type === 'tank' ? 10 + wave * 3 : 5 + wave * 2;
        player.hp -= Math.floor(baseDmg * d.zombieDmgMult);
        z.attackCooldown = z.type === 'tank' ? 50 : 30;
        shakeAmount = z.type === 'tank' ? 10 : 6;
        spawnParticles(player.x, player.y, '#ff4444', z.type === 'tank' ? 14 : 8);
        sfxPlayerHurt();
        if (player.hp <= 0) { endGame(false); return; }
        hpDisplay.textContent = player.hp;
      }
    }
    z.attackCooldown = Math.max(0, z.attackCooldown - 1);
  }

  // Mutual attraction
  const ATTRACT_RANGE = 80;
  const ATTRACT_FORCE = 0.15;
  for (let i = 0; i < zombies.length; i++) {
    for (let j = i + 1; j < zombies.length; j++) {
      const a = zombies[i], b = zombies[j];
      const d3 = dist(a, b);
      if (d3 < ATTRACT_RANGE && d3 > 1) {
        const force = (ATTRACT_RANGE - d3) / ATTRACT_RANGE * ATTRACT_FORCE;
        const dx = (b.x - a.x) / d3 * force;
        const dy = (b.y - a.y) / d3 * force;
        a.x += dx; a.y += dy;
        b.x -= dx; b.y -= dy;
      }
    }
  }
  for (const z of zombies) {
    z.x = Math.max(-40, Math.min(W + 40, z.x));
    z.y = Math.max(-40, Math.min(H + 40, z.y));
  }

  // Bullet-zombie collision
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    for (let j = zombies.length - 1; j >= 0; j--) {
      const z = zombies[j];
      if (dist(b, z) < b.radius + z.radius) {
        z.hp -= b.damage;
        z.stunTimer = 6;
        spawnParticles(b.x, b.y, '#ffff66', 5);
        sfxHit();
        b.pierce--;
        if (b.pierce < 0) bullets.splice(i, 1);
        if (z.hp <= 0) {
          spawnParticles(z.x, z.y, '#88ff88', 15);
          sfxZombieDie();
          const bonus = z.type === 'tank' ? 8 : z.type === 'ranged' ? 3 : 0;
          const goldDrop = Math.floor((6 + Math.random() * 5 + wave + bonus) * d.goldMult * (easterEgg ? 10 : 1));
          gold += goldDrop;
          goldDisplay.textContent = gold;
          floatingTexts.push({
            x: z.x, y: z.y - 10,
            text: '+' + goldDrop + ' 🪙',
            life: 1, color: '#FFD700',
          });
          zombies.splice(j, 1);
          score++;
          scoreDisplay.textContent = score;
        }
        break;
      }
    }
  }

  // Update particles
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.life -= p.decay; }
  particles = particles.filter(p => p.life > 0);

  // Update floating texts
  for (const t of floatingTexts) { t.y -= 1.2; t.life -= 0.016; }
  floatingTexts = floatingTexts.filter(t => t.life > 0);

  shakeAmount *= 0.85;
}

// ── Draw ──
function drawHealthBar(x, y, w, hp, maxHp, color) {
  const h = 5, px = x - w / 2;
  ctx.fillStyle = '#333';
  ctx.fillRect(px, y, w, h);
  const ratio = Math.max(0, hp / maxHp);
  ctx.fillStyle = ratio > 0.5 ? color : ratio > 0.25 ? '#ffaa00' : '#ff3333';
  ctx.fillRect(px, y, w * ratio, h);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1;
  ctx.strokeRect(px, y, w, h);
}

function drawPlant(x, y, r) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#8B4513';
  ctx.beginPath(); ctx.arc(0, 4, r * 0.6, 0, Math.PI); ctx.fill();
  ctx.fillStyle = '#A0522D';
  ctx.fillRect(-r * 0.55, -2, r * 1.1, r * 0.45);
  ctx.strokeStyle = '#228B22'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(0, -2); ctx.lineTo(0, -r * 1.1); ctx.stroke();
  ctx.fillStyle = '#32CD32';
  ctx.beginPath(); ctx.ellipse(-r * 0.55, -r * 0.4, r * 0.45, r * 0.2, -0.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(r * 0.55, -r * 0.55, r * 0.45, r * 0.2, 0.4, 0, Math.PI * 2); ctx.fill();
  const petals = 8;
  for (let i = 0; i < petals; i++) {
    const a = (i / petals) * Math.PI * 2 + waveTimer * 0.02;
    ctx.fillStyle = i % 2 === 0 ? '#FFD700' : '#FFA500';
    ctx.beginPath();
    ctx.ellipse(Math.cos(a) * r * 0.4, -r * 0.95 + Math.sin(a) * r * 0.35, r * 0.28, r * 0.16, a, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#8B4513';
  ctx.beginPath(); ctx.arc(0, -r * 0.95, r * 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#FFE4B5';
  ctx.beginPath(); ctx.arc(0, -r * 0.95, r * 0.1, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(-4, -r * 1.05, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(4, -r * 1.05, 3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawZombie(z) {
  const { x, y, radius: r, type, hp, maxHp } = z;
  ctx.save(); ctx.translate(x, y);
  let bodyColor, headColor, eyeColor;
  if (type === 'ranged')      { bodyColor = '#6B3A6B'; headColor = '#8B4789'; eyeColor = '#ff6600'; }
  else if (type === 'tank')   { bodyColor = '#3E2723'; headColor = '#4E342E'; eyeColor = '#ff0000'; }
  else                        { bodyColor = '#556B2F'; headColor = '#6B8E23'; eyeColor = '#ff0'; }
  ctx.fillStyle = bodyColor;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = headColor;
  ctx.fillRect(-r * 0.5, -r * 0.7, r * 1.0, r * 1.0);
  if (type === 'tank') { ctx.fillStyle = '#5D4037'; ctx.fillRect(-r * 0.55, r * 0.05, r * 1.1, r * 0.22); }
  ctx.fillStyle = headColor;
  ctx.beginPath(); ctx.arc(0, -r * 0.65, r * 0.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = eyeColor;
  ctx.beginPath(); ctx.arc(-r * 0.18, -r * 0.75, r * 0.12, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(r * 0.18, -r * 0.75, r * 0.12, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(-r * 0.18, -r * 0.75, r * 0.05, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(r * 0.18, -r * 0.75, r * 0.05, 0, Math.PI * 2); ctx.fill();
  if (type === 'ranged') {
    ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(r * 0.5, r * 0.1); ctx.lineTo(r * 1.1, -r * 0.5); ctx.stroke();
    ctx.fillStyle = '#cc44ff'; ctx.shadowColor = '#cc44ff'; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.arc(r * 1.1, -r * 0.5, r * 0.18, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  } else {
    const armSwing = Math.sin(waveTimer * 0.08) * 0.3;
    ctx.strokeStyle = headColor; ctx.lineWidth = type === 'tank' ? 6 : 4;
    ctx.beginPath(); ctx.moveTo(-r * 0.5, -r * 0.1); ctx.lineTo(-r * 0.9, r * 0.3 + armSwing * 10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r * 0.5, -r * 0.1); ctx.lineTo(r * 0.9, r * 0.3 - armSwing * 10); ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = type === 'ranged' ? '#cc44ff' : type === 'tank' ? '#ff6644' : '#aaa';
  ctx.font = 'bold 9px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  const label = type === 'ranged' ? '远程' : type === 'tank' ? '坦克' : '';
  if (label) ctx.fillText(label, x, y - r - 18);
  ctx.textAlign = 'start';
  drawHealthBar(x, y - r - 12, type === 'tank' ? 40 : 30, hp, maxHp,
    type === 'ranged' ? '#cc44ff' : type === 'tank' ? '#ff6644' : '#4caf50');
}

function drawPlayerBullet(x, y, r) {
  ctx.fillStyle = '#FFD700'; ctx.shadowColor = '#FFA500'; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
}

function drawEnemyBullet(x, y, r) {
  ctx.fillStyle = '#cc44ff'; ctx.shadowColor = '#ff00ff'; ctx.shadowBlur = 6;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
}

function drawGround() {
  const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  skyGrad.addColorStop(0, '#87CEEB'); skyGrad.addColorStop(0.5, '#B0E0E6'); skyGrad.addColorStop(1, '#E0F0E8');
  ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, W, GROUND_Y);
  const groundGrad = ctx.createLinearGradient(0, GROUND_Y, 0, H);
  groundGrad.addColorStop(0, '#7CFC00'); groundGrad.addColorStop(0.15, '#228B22');
  groundGrad.addColorStop(0.5, '#8B4513'); groundGrad.addColorStop(1, '#654321');
  ctx.fillStyle = groundGrad; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.strokeStyle = '#32CD32'; ctx.lineWidth = 2;
  for (let i = 0; i < 30; i++) {
    const gx = (i * 32 + 15) % W, gh = GROUND_Y;
    ctx.beginPath();
    ctx.moveTo(gx, gh); ctx.lineTo(gx - 4, gh - 10 - Math.random() * 6);
    ctx.moveTo(gx, gh); ctx.lineTo(gx + 4, gh - 8 - Math.random() * 6);
    ctx.stroke();
  }
}

function drawUpgradePanel() {
  const panelX = W - 175, panelY = 8, panelW = 168, panelH = 227;
  ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(panelX, panelY, panelW, panelH, 10); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#FFD700'; ctx.font = 'bold 13px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center'; ctx.fillText('升级面板 (按键1-6)', panelX + panelW/2, panelY + 22); ctx.textAlign = 'start';
  for (let i = 0; i < 6; i++) {
    const rowY = panelY + 40 + i * 32;
    const def = UPGRADE_DEFS[i], lv = upgradeLevels[i], cost = upgradeCost(i), canAfford = gold >= cost;
    ctx.fillStyle = canAfford ? '#4caf50' : '#555';
    ctx.beginPath(); ctx.roundRect(panelX + 6, rowY - 8, 22, 20, 5); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px "Microsoft YaHei", sans-serif';
    ctx.fillText(i + 1, panelX + 13, rowY + 6);
    ctx.fillStyle = '#fff'; ctx.font = '11px "Microsoft YaHei", sans-serif';
    ctx.fillText(def.icon + ' ' + def.name + ' Lv.' + lv, panelX + 34, rowY + 1);
    ctx.fillStyle = '#aaa'; ctx.font = '9px "Microsoft YaHei", sans-serif';
    ctx.fillText(def.desc, panelX + 34, rowY + 14);
    ctx.fillStyle = canAfford ? '#FFD700' : '#ff6666';
    ctx.font = 'bold 10px "Microsoft YaHei", sans-serif'; ctx.textAlign = 'right';
    ctx.fillText('🪙' + cost, panelX + panelW - 8, rowY + 6); ctx.textAlign = 'start';
  }
}

// ── Menu Drawing ──
function drawMenu() {
  // Background
  drawGround();

  // Decorative menu zombies
  menuTime++;
  const decoZombies = [
    { x: 100, y: GROUND_Y - 20, type: 'normal' },
    { x: 750, y: GROUND_Y - 20, type: 'ranged' },
    { x: 420, y: GROUND_Y - 20, type: 'tank' },
  ];
  for (const dz of decoZombies) {
    const fakeZ = { x: dz.x + Math.sin(menuTime * 0.02 + dz.x) * 10, y: dz.y, radius: dz.type === 'tank' ? 25 : dz.type === 'ranged' ? 16 : 18, type: dz.type, hp: 50, maxHp: 50 };
    drawZombie(fakeZ);
  }

  // Dark overlay
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, H);

  // Title
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 52px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('🌻 植物防守 🌻', W/2, 90);
  ctx.fillStyle = '#fff';
  ctx.font = '18px "Microsoft YaHei", sans-serif';
  ctx.fillText('鼠标操控移动 · 自动攻击僵尸 · 按键1-6升级', W/2, 125);
  ctx.textAlign = 'start';

  // Easter egg indicator
  if (easterEgg) {
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 20px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('⭐ 十倍模式已激活! ⭐', W/2, 152);
    ctx.textAlign = 'start';
  }

  // Draw plant in center
  const py = GROUND_Y - 40;
  drawPlant(W/2, py, 28);

  // Difficulty buttons
  const btnW = 220, btnH = 70, gap = 24;
  const startX = W/2 - btnW/2;
  const totalH = 3 * btnH + 2 * gap;
  const startY = H/2 - totalH/2 + 55;
  const keys = ['easy', 'normal', 'hard'];
  const hoveredIdx = getHoveredBtn(startX, startY, btnW, btnH, gap);

  for (let i = 0; i < 3; i++) {
    const bx = startX, by = startY + i * (btnH + gap);
    const d = DIFFICULTIES[keys[i]];
    const isHovered = hoveredIdx === i;

    // Button glow
    if (isHovered) {
      ctx.shadowColor = d.color; ctx.shadowBlur = 20;
    }
    ctx.fillStyle = isHovered ? d.color : 'rgba(255,255,255,0.12)';
    ctx.strokeStyle = d.color;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(bx, by, btnW, btnH, 14); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;

    // Text
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(d.name, bx + btnW/2, by + 32);
    ctx.fillStyle = isHovered ? '#fff' : '#ccc';
    ctx.font = '13px "Microsoft YaHei", sans-serif';
    ctx.fillText(d.desc + ' · ' + d.totalWaves + '波', bx + btnW/2, by + 54);
    ctx.textAlign = 'start';
  }

  // Menu particles
  for (const p of menuParticles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function getHoveredBtn(startX, startY, btnW, btnH, gap) {
  for (let i = 0; i < 3; i++) {
    const bx = startX, by = startY + i * (btnH + gap);
    if (mouseX >= bx && mouseX <= bx + btnW && mouseY >= by && mouseY <= by + btnH) {
      return i;
    }
  }
  return -1;
}

// ── Scene rendering ──
function drawPlaying() {
  ctx.save();
  if (shakeAmount > 0.3) {
    ctx.translate((Math.random() - 0.5) * shakeAmount, (Math.random() - 0.5) * shakeAmount);
  }
  drawGround();
  // Crosshair
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(mouseX, mouseY, 14, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(mouseX - 20, mouseY); ctx.lineTo(mouseX - 10, mouseY);
  ctx.moveTo(mouseX + 10, mouseY); ctx.lineTo(mouseX + 20, mouseY);
  ctx.moveTo(mouseX, mouseY - 20); ctx.lineTo(mouseX, mouseY - 10);
  ctx.moveTo(mouseX, mouseY + 10); ctx.lineTo(mouseX, mouseY + 20);
  ctx.stroke();
  for (const b of bullets) drawPlayerBullet(b.x, b.y, b.radius);
  for (const eb of enemyBullets) drawEnemyBullet(eb.x, eb.y, eb.radius);
  for (const z of zombies) drawZombie(z);
  drawPlant(player.x, player.y, player.radius);
  drawHealthBar(player.x, player.y - player.radius - 14, 44, player.hp, player.maxHp, '#4caf50');
  for (const p of particles) {
    ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const t of floatingTexts) {
    ctx.globalAlpha = t.life; ctx.fillStyle = t.color;
    ctx.font = 'bold 13px "Microsoft YaHei", sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(t.text, t.x, t.y); ctx.textAlign = 'start';
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  drawUpgradePanel();

  // Difficulty badge
  const d = DIFFICULTIES[difficulty];
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.beginPath(); ctx.roundRect(12, H - 36, 70, 26, 13); ctx.fill();
  ctx.fillStyle = d.color; ctx.font = 'bold 13px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center'; ctx.fillText(d.name, 47, H - 18); ctx.textAlign = 'start';

  // Pause overlay
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('⏸️ 游戏暂停', W/2, H/2 - 20);
    ctx.fillStyle = '#ccc';
    ctx.font = '18px "Microsoft YaHei", sans-serif';
    ctx.fillText('按 P 或 Esc 键继续', W/2, H/2 + 30);
    ctx.textAlign = 'start';
  }
}

// ── Flow control ──
function startGame(diff) {
  difficulty = diff;
  initGameState();
  gamePhase = 'playing';
  paused = false;
  uiDiv.style.display = 'flex';
  gameOverDiv.style.display = 'none';
  hpDisplay.textContent = player.hp;
  goldDisplay.textContent = gold;
  scoreDisplay.textContent = '0';
  waveDisplay.textContent = '1/' + d.totalWaves;
  canvas.style.cursor = 'none';
  initAudio();
  startGameBGM();
  startWave();
}

function endGame(won) {
  gamePhase = 'gameover';
  stopBGM();
  gameOverDiv.style.display = 'flex';
  goTitle.textContent = won ? '胜利!' : '游戏结束';
  goTitle.style.color = won ? '#FFD700' : '#ff4444';
  goScore.textContent = '难度: ' + DIFFICULTIES[difficulty].name + ' | 击杀: ' + score + ' | 波次: ' + wave + ' | 金币: ' + gold;
  restartBtn.textContent = '返回菜单';
  canvas.style.cursor = 'default';
}

function goBackToMenu() {
  gamePhase = 'menu';
  startMenuBGM();
  difficulty = null;
  bullets = []; enemyBullets = []; zombies = []; particles = []; floatingTexts = [];
  menuParticles = [];
  menuTime = 0;
  canvas.style.cursor = 'default';
}

// ── Main Loop ──
function updateMenu() {
  for (const p of menuParticles) { p.x += p.vx; p.y += p.vy; p.life -= p.decay; }
  menuParticles = menuParticles.filter(p => p.life > 0);
  // Spawn ambient particles
  if (menuTime % 20 === 0) {
    spawnParticles(Math.random() * W, GROUND_Y - 10, '#FFD700', 1);
  }
}

function loop() {
  ctx.clearRect(0, 0, W, H);
  if (gamePhase === 'menu') {
    updateMenu();
    drawMenu();
  } else if (gamePhase === 'playing') {
    update();
    drawPlaying();
  } else if (gamePhase === 'gameover') {
    drawPlaying();
  }
  requestAnimationFrame(loop);
}

// Initial menu background particles
for (let i = 0; i < 15; i++) {
  menuParticles.push({
    x: Math.random() * W, y: Math.random() * H,
    color: '#FFD700',
    vx: (Math.random() - 0.5) * 1.5,
    vy: -1 - Math.random() * 2,
    life: Math.random(), decay: 0.005 + Math.random() * 0.01,
    size: 2 + Math.random() * 3,
  });
}

loop();
</script>
